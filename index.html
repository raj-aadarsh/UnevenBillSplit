<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bill Split</title>
    <meta name="description" content="Scan a bill, tap who had what, and split it fairly — taxes shared equally." />

    <!-- PWA / home screen -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1214" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bill Split" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="app" aria-live="polite">
      <div class="boot">
        <div class="spinner"></div>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript>Please enable JavaScript to use Bill Split.</noscript>
  </body>
</html>
